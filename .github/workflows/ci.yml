name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    name: Type check, build and test
    runs-on: ubuntu-latest
    env:
      # The tests run under Node; nothing here launches Electron
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check (Node side and page)
        run: npm run typecheck
      - name: Build and test (node --test)
        run: npm test

  test-windows:
    # The editor launches and kills the host as a child process, and Windows is where the engine runs: the launcher
    # (pipes, \r\n ready lines, kill) is tested there too
    name: Build and test on Windows
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and test (node --test)
        run: npm test

  protocol:
    name: Generated protocol and Lua API match the pinned engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned engine ref
        id: engine
        run: echo "ref=$(tr -d '[:space:]' < engine-ref.txt)" >> "$GITHUB_OUTPUT"
      - name: Check out the engine's protocol at that ref
        uses: actions/checkout@v4
        with:
          repository: EpicNicks/N2Engine
          ref: ${{ steps.engine.outputs.ref }}
          path: engine
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            editor-server/protocol
            editor-server/editor-api.lua
            engine/src/scripting/bindings/engine-api.lua
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate protocol and Lua API declarations
        run: |
          node scripts/sync-protocol.js engine
          node scripts/sync-lua-api.js engine
      - name: Fail if generated declarations differ from committed files
        run: |
          if [ -n "$(git status --porcelain -- src/protocol src/renderer/lua/lua-api.generated.json)" ]; then
            git status --porcelain -- src/protocol src/renderer/lua/lua-api.generated.json
            git diff -- src/protocol src/renderer/lua/lua-api.generated.json
            echo "::error::Generated protocol or Lua API declarations are out of date with the engine at $(cat engine-ref.txt). Run npm run sync-protocol and npm run sync-lua-api against that engine commit and commit the result."
            exit 1
          fi
